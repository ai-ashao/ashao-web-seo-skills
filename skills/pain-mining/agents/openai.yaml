interface:
  display_name: "Pain Mining"
  short_description: "Mine user pain, workaround chains, and tool-site gaps without forcing a pain graph."
  default_prompt: "Use $pain-mining to mine evidence-backed user pain. Separate query yield from pain density, reframe SEO nouns into task language, use bounded source widening when searchability fails, classify the corpus BROAD/NARROW/SPARSE, and in tool-site mode separate FEATURE, PAGE_CANDIDATE, HOMEPAGE_COPY, and FAQ_GUIDE."
policy:
  allow_implicit_invocation: true
