name: Production SEO Portfolio Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-seo-portfolio-regression.yml"

jobs:
  audit:
    name: audit-${{ matrix.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: workshopfetch
            url: https://workshopfetch.com/
          - site: mdformats
            url: https://mdformats.com/
          - site: photoready
            url: https://photoready.app/
          - site: imgsizetokb
            url: https://imgsizetokb.com/
          - site: chartodyssey
            url: https://chartodyssey.com/
          - site: hueodyssey
            url: https://hueodyssey.com/
          - site: meshodyssey
            url: https://meshodyssey.com/
          - site: fontodyssey
            url: https://fontodyssey.com/
          - site: fnspritehub
            url: https://fnspritehub.com/

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run technical SEO audit
        id: audit
        shell: bash
        run: |
          mkdir -p portfolio-reports
          set +e
          python skills/technical-seo-audit/scripts/audit.py "${{ matrix.url }}" \
            --profile auto \
            --site \
            --max-pages 200 \
            --max-sitemaps 12 \
            --timeout 15 \
            --output "portfolio-reports/${{ matrix.site }}.md"
          code=$?
          echo "audit_exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print regression summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          site = "${{ matrix.site }}"
          path = Path("portfolio-reports") / f"{site}.json"
          print(f"=== PORTFOLIO_AUDIT {site} ===")
          if not path.exists():
              print("EVIDENCE_MISSING")
              raise SystemExit(0)

          data = json.loads(path.read_text(encoding="utf-8"))
          page = data.get("page") or {}
          site_audit = data.get("site_audit") or {}
          analysis = site_audit.get("analysis") or {}
          crawl = site_audit.get("crawl") or {}
          findings = analysis.get("findings") or []

          print("TARGET", data.get("target_url"))
          print("FINAL_URL", data.get("final_url"))
          print("PROFILE", site_audit.get("effective_profile") or page.get("profile"))
          print("PAGES_CHECKED", analysis.get("pages_checked", 0))
          print("CRAWL_ERRORS", len(crawl.get("errors") or []))
          print("SUMMARY", json.dumps(analysis.get("summary") or {}, ensure_ascii=False))

          release = [f for f in findings if str(f.get("code", "")).startswith("PUBLIC_COPY_")]
          print("RELEASE_COUNT", len(release))
          for item in release:
              ev = item.get("evidence") or {}
              print("RELEASE_FINDING", json.dumps({
                  "priority": item.get("priority"),
                  "code": item.get("code"),
                  "url": item.get("url"),
                  "element": ev.get("element"),
                  "text": ev.get("text"),
                  "match": ev.get("match"),
                  "confidence": ev.get("confidence"),
                  "suggestion": ev.get("suggestion"),
              }, ensure_ascii=False))

          blockers = [f for f in findings if f.get("priority") in {"P0", "P1"}]
          print("P0P1_COUNT", len(blockers))
          for item in blockers[:50]:
              print("P0P1", json.dumps({
                  "priority": item.get("priority"),
                  "code": item.get("code"),
                  "url": item.get("url"),
                  "detail": item.get("detail"),
              }, ensure_ascii=False))
          PY

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: technical-seo-${{ matrix.site }}
          path: portfolio-reports/
          if-no-files-found: warn
