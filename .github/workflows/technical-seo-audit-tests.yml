name: Technical SEO Audit Tests

on:
  push:
    branches: [main]
    paths:
      - "skills/technical-seo-audit/**"
      - ".github/workflows/technical-seo-audit-tests.yml"
      - "requirements.txt"
  pull_request:
    paths:
      - "skills/technical-seo-audit/**"
      - ".github/workflows/technical-seo-audit-tests.yml"
      - "requirements.txt"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run technical-seo-audit tests
        run: python -m unittest discover -s skills/technical-seo-audit/tests -p "test*.py" -v
